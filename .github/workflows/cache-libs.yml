name: Cache win64_vc15

on:
  workflow_dispatch:

jobs:
  cache-libs:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create lib directory
        run: mkdir lib

      - name: SVN Checkout - Retry up to 5 times if fail
        run: |
          @echo off
          set RETRIES=5
          set COUNT=0
          :RETRY
          svn checkout https://svn.blender.org/svnroot/bf-blender/trunk/lib/win64_vc15 lib/win64_vc15
          if %ERRORLEVEL% NEQ 0 (
            set /a COUNT+=1
            if %COUNT% LSS %RETRIES% (
              echo Retry %COUNT%/%RETRIES% after delay...
              timeout /t 30
              goto RETRY
            ) else (
              echo Failed after %RETRIES% attempts
              exit /b 1
            )
          )

      - name: Save win64_vc15 cache
        uses: actions/cache/save@v4
        with:
          path: lib/win64_vc15
          key: win64-vc15-cache
