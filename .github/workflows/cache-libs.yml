name: Cache win64_vc15 Libraries

on:
  workflow_dispatch:

jobs:
  cache-libs:
    runs-on: windows-latest

    steps:
    - name: Set up directory structure
      run: |
        mkdir -p lib
        mkdir -p lib/win64_vc15

    - name: Restore cached win64_vc15
      uses: actions/cache@v4
      id: cache-win64
      with:
        path: lib/win64_vc15
        key: win64-vc15-static

    - name: Retry SVN checkout up to 5 times
      shell: pwsh
      run: |
        $retries = 5
        $success = $false
        for ($i = 1; $i -le $retries; $i++) {
          try {
            Write-Host "Attempt ${i}: Checking out win64_vc15 libs..."
            svn checkout https://svn.blender.org/svnroot/bf-blender/trunk/lib/win64_vc15 lib/win64_vc15 --non-interactive --trust-server-cert
            $success = $true
            break
          } catch {
            Write-Host "Attempt ${i} failed: $($_.Exception.Message)"
            Start-Sleep -Seconds 30
          }
        }
        if (-not $success) {
          Write-Host "Failed to checkout after $retries attempts. Continuing so cache can be saved."
        }

    - name: Save partial win64_vc15 cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: lib/win64_vc15
        key: win64-vc15-static
