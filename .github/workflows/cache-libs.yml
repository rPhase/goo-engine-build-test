name: Cache win64_vc15 Libraries

on:
  workflow_dispatch:

jobs:
  cache-libs:
    runs-on: windows-latest

    steps:
    - name: Set up directory structure
      run: |
        mkdir -p lib
        mkdir -p lib/win64_vc15

    - name: Download win64_vc15 archive
      run: |
        curl -L -o win64_vc15.7z https://github.com/rPhase/blender-lib-win64_vc15/releases/download/v0.0.2/win64_vc15.7z
    
    - name: Extract 7z archive
      run: 7z x win64_vc15.7z -olib\win64_vc15 -y

    - name: Cache win64_vc15 libs
      uses: actions/cache@v3
      with:
        path: lib/win64_vc15
        key: win64-vc15-cache
        restore-keys: |
          win64-vc15-cache
